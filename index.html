<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Ridgeline Offroad</title>
<style>
  html, body { height: 100%; margin: 0; background: #0d0f12; overflow: hidden; }
  body { color: #e6e9ee; font: 13px/1.6 ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; }
  #view { display: block; width: 100vw; height: 100vh; touch-action: none; }

  #boot {
    position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
    background: radial-gradient(120% 90% at 50% 25%, #1a1f27 0%, #0b0d10 70%);
    text-align: center;
  }
  #boot h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: .28em; font-weight: 600; }
  #boot .sub { color: #8a93a0; font-size: 12px; letter-spacing: .06em; }
  #boot .spin {
    width: 180px; height: 2px; margin: 22px auto 10px; border-radius: 2px;
    background: rgba(255,255,255,.12); overflow: hidden; position: relative;
  }
  #boot .spin::after {
    content: ''; position: absolute; inset: 0 auto 0 0; width: 38%;
    background: #d2761f; animation: slide 1.1s ease-in-out infinite;
  }
  @keyframes slide { 0% { left: -38%; } 100% { left: 100%; } }
  #boot-msg { color: #d2761f; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
  #boot .hint { margin-top: 26px; color: #626b78; font-size: 11px; }
  #boot .hint b { color: #8a93a0; font-weight: 500; }

  #boot.error { place-items: start center; padding-top: 8vh; overflow: auto; }
  #boot.error .box { max-width: 900px; text-align: left; }
  #boot.error h2 { color: #d14b3c; font-size: 13px; letter-spacing: .2em; margin: 0 0 10px; }
  #boot.error pre {
    white-space: pre-wrap; font-size: 12px; color: #e0a02a; line-height: 1.6;
    background: rgba(0,0,0,.45); border: 1px solid rgba(209,75,60,.35);
    border-radius: 6px; padding: 14px;
  }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="boot">
  <div>
    <h1>RIDGELINE</h1>
    <div class="sub">offroad</div>
    <div class="spin"></div>
    <div id="boot-msg">loading</div>
    <div class="hint">
      <b>W A S D</b> drive &nbsp;&middot;&nbsp; <b>Q E</b> gears &nbsp;&middot;&nbsp; <b>L</b> range
      &nbsp;&middot;&nbsp; <b>X</b> diff lock &nbsp;&middot;&nbsp; <b>R</b> recover &nbsp;&middot;&nbsp; <b>/</b> all controls
      <br /><br />
      <a href="./showroom.html" style="color:#d2761f">vehicle showroom</a>
    </div>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
