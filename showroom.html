<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ridgeline — Vehicle Showroom</title>
<style>
  :root {
    --bg: #0d0f12; --panel: #15181d; --line: #262b33;
    --text: #e6e9ee; --dim: #8a93a0; --accent: #d2761f; --accent2: #4a9d6a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.45 ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  #ui { position: fixed; top: 0; left: 0; bottom: 0; width: 272px; padding: 16px;
    background: linear-gradient(180deg, rgba(21,24,29,.97), rgba(13,15,18,.94));
    border-right: 1px solid var(--line); overflow-y: auto; backdrop-filter: blur(8px); }
  #ui h1 { margin: 0 0 2px; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; }
  #ui .sub { color: var(--dim); font-size: 11px; margin-bottom: 18px; }
  .group { margin-bottom: 18px; }
  .group > label { display: block; font-size: 10px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--dim); margin-bottom: 7px; }

  .vlist { display: flex; flex-direction: column; gap: 5px; }
  .vbtn { text-align: left; padding: 8px 10px; background: #1b1f25; color: var(--text);
    border: 1px solid var(--line); border-radius: 5px; cursor: pointer; font: inherit;
    transition: border-color .12s, background .12s; }
  .vbtn:hover { border-color: #3a424e; }
  .vbtn.on { border-color: var(--accent); background: #241d14; }
  .vbtn small { display: block; color: var(--dim); font-size: 10px; margin-top: 2px; }

  .swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
  .sw { aspect-ratio: 1; border-radius: 4px; border: 2px solid transparent; cursor: pointer; }
  .sw.on { border-color: var(--text); }

  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .row span { flex: 0 0 74px; color: var(--dim); font-size: 11px; }
  .row output { flex: 0 0 38px; text-align: right; color: var(--accent); font-size: 11px; }
  input[type=range] { flex: 1; accent-color: var(--accent); height: 3px; }

  .toggles { display: flex; flex-wrap: wrap; gap: 5px; }
  .tg { padding: 5px 9px; font: inherit; font-size: 11px; background: #1b1f25;
    border: 1px solid var(--line); border-radius: 4px; color: var(--dim); cursor: pointer; }
  .tg.on { color: #111; background: var(--accent2); border-color: var(--accent2); }

  #stats { position: fixed; right: 12px; top: 12px; padding: 9px 12px; font-size: 11px;
    background: rgba(21,24,29,.9); border: 1px solid var(--line); border-radius: 5px;
    color: var(--dim); text-align: right; line-height: 1.7; }
  #stats b { color: var(--text); font-weight: 500; }
  #hint { position: fixed; right: 12px; bottom: 12px; font-size: 11px; color: var(--dim);
    text-align: right; line-height: 1.6; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center;
    background: var(--bg); z-index: 20; font-size: 12px; letter-spacing: .1em; color: var(--dim); }
  @media (max-width: 780px) {
    #ui { width: 100%; height: 46%; top: auto; bottom: 0; border-right: 0; border-top: 1px solid var(--line); }
    #stats { top: auto; bottom: calc(46% + 12px); }
    #hint { display: none; }
  }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="loading">BUILDING VEHICLES…</div>
  <aside id="ui">
    <h1>Ridgeline</h1>
    <div class="sub">Vehicle showroom · procedural build</div>

    <div class="group"><label>Rig</label><div class="vlist" id="vehicles"></div></div>
    <div class="group"><label>Paint</label><div class="swatches" id="swatches"></div></div>

    <div class="group">
      <label>Chassis</label>
      <div class="row"><span>Steering</span><input id="steer" type="range" min="-1" max="1" step="0.01" value="0"><output id="steerOut">0°</output></div>
      <div class="row"><span>Articulate</span><input id="artic" type="range" min="-1" max="1" step="0.01" value="0"><output id="articOut">0</output></div>
      <div class="row"><span>Mud</span><input id="mud" type="range" min="0" max="1" step="0.01" value="0"><output id="mudOut">0%</output></div>
      <div class="row"><span>Turntable</span><input id="spin" type="range" min="0" max="1" step="0.01" value="0.25"><output id="spinOut">.25</output></div>
    </div>

    <div class="group">
      <label>Display</label>
      <div class="toggles">
        <button class="tg" id="tgLights">Lights</button>
        <button class="tg" id="tgAux">Light bar</button>
        <button class="tg" id="tgFlex">Flex demo</button>
        <button class="tg" id="tgRoll">Roll wheels</button>
        <button class="tg" id="tgWire">Wireframe</button>
        <button class="tg on" id="tgShadow">Shadows</button>
        <button class="tg" id="tgGhost">X-ray body</button>
        <button class="tg" id="tgNight">Night</button>
      </div>
    </div>

    <div class="group">
      <label>Detail</label>
      <div class="toggles" id="lods">
        <button class="tg" data-lod="0">Far</button>
        <button class="tg" data-lod="1">Mid</button>
        <button class="tg on" data-lod="2">Hero</button>
      </div>
    </div>
  </aside>

  <div id="stats"></div>
  <div id="hint">drag to orbit · scroll to zoom<br>1–4 switch rig · F flex · L lights</div>
  <script>
    // Surface module errors on the loading overlay - a black screen with no
    // explanation is the worst way to debug a WebGL app.
    function showErr(msg) {
      var el = document.getElementById('loading');
      if (!el) return;
      el.style.cssText += ';color:#e0674f;white-space:pre-wrap;padding:32px;'
        + 'text-align:left;font-size:12px;letter-spacing:0;align-content:center';
      el.textContent = 'STARTUP ERROR\n\n' + msg;
    }
    addEventListener('error', function (e) {
      showErr((e.error && (e.error.stack || e.error.message)) || e.message);
    });
    addEventListener('unhandledrejection', function (e) {
      showErr(String((e.reason && (e.reason.stack || e.reason.message)) || e.reason));
    });
  </script>
  <script type="module" src="/src/showroom/main.js"></script>
</body>
</html>
